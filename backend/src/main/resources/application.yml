spring:
  application:
    name: dfbrs-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dfbrs}
    username: ${DB_USERNAME:dfbrs_user}
    password: ${DB_PASSWORD:dfbrs_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET:replace-with-very-secure-random-secret}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

storage:
  base-dir: ${STORAGE_BASE_DIR:C:/edu/projects/Distributed File Backup and Recovery System/distributed-file-backup-recovery/backend/storage}
  chunk-size: ${STORAGE_CHUNK_SIZE:4194304}
